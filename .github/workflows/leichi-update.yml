name: leichi-update

on:
  schedule:
    - cron: '0 12 */2 * *'   # UTC 12:00 每2天 = 北京时间 20:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate leichi_black.rsc
        run: bash "$GITHUB_WORKSPACE/generator.bash"

      - name: Sanity check
        run: |-
          FILE="dist/leichi_black.rsc"
          echo "字节=$(wc -c < "$FILE") v4=$(grep -cE '^:do \{add address=[0-9]+\.[0-9]+' "$FILE") v6=$(grep -cE '^:do \{add address=[0-9a-fA-F:]+:' "$FILE")"
          head -6 "$FILE"
          if [ "$(grep -cE '^:do \{add address=' "$FILE")" -lt 100 ]; then
            echo "条目过少，放弃提交"; exit 1
          fi

      - name: Commit and push
        run: |-
          FILE="dist/leichi_black.rsc"
          git config user.email "action_bot@rookiezoe.com"
          git config user.name "ActionBot"
          git add -N "$FILE"
          git diff --quiet --cached -- "$FILE" && { echo "无变化"; exit 0; }
          git add "$FILE"
          git commit -m "Auto update leichi blacklist [every 2 days]"

          echo ">>> 拉远端并变基"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"

          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
