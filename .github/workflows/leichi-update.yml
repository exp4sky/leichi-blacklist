name: leichi-update

on:
  schedule:
    - cron: '0 7 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Cache tmp
        uses: actions/cache@v4
        with:
          path: tmp
          key: leichi-tmp-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            leichi-tmp-${{ runner.os }}-

      - name: Generate leichi_black.rsc
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 3
          retry_on: error
          command: bash -x "$GITHUB_WORKSPACE/generator.bash" 2>&1

      - name: Commit & push
        run: |-
          FILE="dist/leichi_black.rsc"
          echo "=== 产物校验 ==="
          ls -la "$FILE"
          echo "v4=$(grep -cE '^:do \{add address=[0-9]+\.[0-9]+' "$FILE") v6=$(grep -cE '^:do \{add address=[0-9a-fA-F:]+:' "$FILE")"

          git config user.name  "ActionBot"
          git config user.email "action_bot@rookiezoe.com"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "真的没变化，跳过"
            exit 0
          fi

          git commit -m "Auto update leichi blacklist [every 2 days]"
          git push
