name: leichi-update

on:
  schedule:
    - cron: '0 12 */2 * *'   # UTC 12:00 每2天 = 北京时间 20:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate leichi_black.rsc
        run: bash "$GITHUB_WORKSPACE/generator.bash"

      - name: Sanity check
        run: |-
          FILE="dist/leichi_black.rsc"
          echo "[DEBUG] 字节: $(wc -c < "$FILE") 行: $(wc -l < "$FILE")"
          echo "[DEBUG] v4 add 行: $(grep -cE '^:do \{add address=[0-9]+\.[0-9]+' "$FILE")"
          echo "[DEBUG] v6 add 行: $(grep -cE '^:do \{add address=[0-9a-fA-F:]+:' "$FILE")"
          echo "[DEBUG] 首 12 行:"
          head -12 "$FILE"
          if [ "$(grep -cE '^:do \{add address=' "$FILE")" -lt 100 ]; then
            echo "!! rsc 有效条目过少，终止提交，保留上一版"
            exit 1
          fi

      - name: Commit and push if changed
        run: |-
          git config --global user.email "action_bot@rookiezoe.com"
          git config --global user.name "ActionBot"

          # 没变化就安静退出
          git add -N dist/leichi_black.rsc
          if git diff --quiet --cached -- dist/leichi_black.rsc; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git add dist/leichi_black.rsc
          git commit -m "Auto update leichi blacklist [every 2 days]"

          # 关键：先拉远端新提交，把本次提交接在后面再推，彻底治 non-fast-forward
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"

          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
