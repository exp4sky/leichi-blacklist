name: leichi-update

on:
  schedule:
    - cron: '0 12 */2 * *'   # UTC 12:00 每2天 = 北京时间 20:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate leichi_black.rsc
        run: bash "$GITHUB_WORKSPACE/generator.bash"

      - name: Sanity check
        run: |-
          FILE="dist/leichi_black.rsc"
          echo "[DEBUG] 行数: $(wc -l < "$FILE")"
          echo "[DEBUG] 首 10 行:"
          head -10 "$FILE"
          echo "[DEBUG] 末尾 5 行:"
          tail -5 "$FILE"
          # 兜底：空的 rsc 不让它覆盖仓库里的旧版
          if [ "$(wc -l < "$FILE")" -lt 20 ]; then
            echo "!! 生成的 rsc 异常偏短，终止提交"
            exit 1
          fi

      - name: Commit and push if changed
        run: |-
          git diff
          git config --global user.email "action_bot@rookiezoe.com"
          git config --global user.name "ActionBot"
          git add dist/leichi_black.rsc
          git commit -m "Auto update leichi blacklist [every 2 days]" || exit 0
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
