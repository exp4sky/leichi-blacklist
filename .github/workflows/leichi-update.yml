name: leichi-update

on:
  schedule:
    - cron: '0 12 */2 * *'   # UTC 12:00 每2天 = 北京时间 20:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true      # v5 默认就带，显式写出来保险

      - name: Generate leichi_black.rsc
        run: bash "$GITHUB_WORKSPACE/generator.bash"

      - name: Commit & push
        run: |-
          FILE="dist/leichi_black.rsc"
          echo "=== 产物校验 ==="
          ls -la "$FILE"
          echo "v4=$(grep -cE '^:do \{add address=[0-9]+\.[0-9]+' "$FILE") v6=$(grep -cE '^:do \{add address=[0-9a-fA-F:]+:' "$FILE")"

          git config user.name  "ActionBot"
          git config user.email "action_bot@rookiezoe.com"

          # 关键：真正把内容加进暂存区，而不是 -N 占位
          git add "$FILE"

          # 跟 HEAD 比，连“内容从 1 字节变成 386KB”也算变化
          if git diff --cached --quiet; then
            echo "真的没变化，跳过"; exit 0
          fi

          git commit -m "Auto update leichi blacklist [every 2 days]"

          # v5 + persist-credentials 下，直接推就行，不用手 rebase
          git push
